<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Login - Umbra</title>
<link rel="stylesheet" href="/static/css/style.css">
<style>body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#ffc8dd,#a2d2ff)} .form-card{width:360px}</style>
</head><body>
<div class="form-card">
  <h2>Panel Admin</h2>
  <p style="margin-top:18px;margin-bottom:8px;">¿Cuánto es <strong id="firstNumber">{{ first }}</strong> + <strong id="secondNumber">{{ second }}</strong>?</p>
  <input type="number" id="answer" placeholder="Resultado" autocomplete="off"><button id="btnLogin" class="btn-primary full" style="margin-top:12px">Entrar</button>
  <p id="msg" style="margin-top:12px; min-height:20px;"></p>
</div>
<script>
const msg = document.getElementById('msg');
const answerInput = document.getElementById('answer');

async function tryLogin(){
  const answer = answerInput.value.trim();
  if (!answer) {
    msg.textContent = 'Escribe la suma.';
    return;
  }
  const res = await fetch('/admin/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ answer })
  });
  const data = await res.json().catch(() => ({}));
  if (res.ok) {
    location.href = '/admin';
    return;
  }
  msg.textContent = data.msg || 'La suma es incorrecta.';
  if (data.first !== undefined && data.second !== undefined) {
    document.getElementById('firstNumber').textContent = data.first;
    document.getElementById('secondNumber').textContent = data.second;
  }
  answerInput.value = '';
  answerInput.focus();
}

document.getElementById('btnLogin').onclick = tryLogin;
answerInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryLogin(); });
</script>
</body></html>
